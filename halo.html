<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>HALO · Concept by Amal Martin</title>
<meta name="description" content="HALO is a fashion brand landing page concept: full-bleed portraits, ultra-light type and a red-to-black wordmark. A personal design project by Amal Martin.">
<meta name="author" content="Amal Martin">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="HALO · Concept by Amal Martin">
<meta property="og:description" content="A fashion brand landing page concept: full-bleed portraits, ultra-light type and a red-to-black wordmark.">
<meta property="og:url" content="https://amal-martin.github.io/halo.html">
<meta property="og:image" content="https://amal-martin.github.io/assets/halo/hero.webp">
<link rel="canonical" href="https://amal-martin.github.io/halo.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='200' fill='%23fff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter Thin and Montserrat ExtraLight/Regular are the fonts in the Figma file.
     Avenir Next (also in the file) is a system font on Apple devices; Mulish is the closest open stand-in elsewhere. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100&family=Montserrat:wght@200;400&family=Mulish:wght@200;400&display=swap" rel="stylesheet">

<style>
  /* One unit = 1px of the 834px-wide Figma frame. It scales with the width of the screen, edge to edge, so the page
     is the same composition on a phone, a tablet, a laptop or a wide monitor. (cqw = the width of .stage, which
     excludes any scrollbar, unlike 100vw.) */
  .stage { container-type: inline-size; width: 100%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; -webkit-text-size-adjust: 100%; }
  body { -webkit-font-smoothing: antialiased; }

  .halo { --u: calc(100cqw / 834); position: relative; width: 100%; height: calc(3148 * var(--u)); overflow: hidden; background: #fff; }
  .halo img { position: absolute; display: block; object-fit: cover; }
  .halo .t { position: absolute; margin: 0; line-height: normal; white-space: nowrap; font-weight: normal; }

  .wm { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 100; font-size: calc(120.669 * var(--u)); width: calc(318 * var(--u)); height: calc(119 * var(--u)); }
  .avenir { font-family: "Avenir Next", "Mulish", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .clip { -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

  .join { position: absolute; left: calc(308 * var(--u)); top: calc(3073 * var(--u)); width: calc(218.505 * var(--u)); height: calc(49.985 * var(--u));
    border: 0; padding: 0; border-radius: calc(29.857 * var(--u)); background: #fff; color: #000; cursor: pointer;
    font-family: "Avenir Next", "Mulish", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 200; font-size: calc(15.005 * var(--u)); line-height: normal; }

  /* a small way back to the portfolio; not part of the design */
  .back { position: fixed; left: 14px; top: 14px; z-index: 5; display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 999px;
    background: rgb(20 20 20 / .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; text-decoration: none;
    font: 500 12px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .02em; transition: background-color .25s ease; }
  .back:hover { background: rgb(20 20 20 / .8); }
  .back svg { width: 12px; height: 12px; }
</style>
</head>
<body>

<div class="stage">
<main class="halo" id="top">

  <!-- 1. hero portrait with the white wordmark -->
  <img src="assets/halo/hero.webp" alt="A model with a platinum bob and dark sunglasses, in an orange high-neck outfit and a white belt, standing between terracotta walls under a blue sky" width="2560" height="1752"
    style="left: calc(-6 * var(--u)); top: 0; width: calc(846 * var(--u)); height: calc(579 * var(--u));">
  <h1 class="t wm" style="left: calc(494 * var(--u)); top: 0; color: #fff;">HALO</h1>

  <!-- 2. close-up with the first tagline -->
  <img src="assets/halo/closeup.webp" alt="A black and white close-up of a face, with glittering flecks scattered across the cheekbone" width="2560" height="1707"
    style="left: 0; top: calc(579 * var(--u)); width: calc(834 * var(--u)); height: calc(559 * var(--u)); object-position: 0 0;">
  <p class="t avenir" style="left: calc(39 * var(--u)); top: calc(1088 * var(--u)); font-size: calc(22.32 * var(--u)); font-weight: 400; color: #e0e0e0;">Futuristic. Fearless. Halo.</p>

  <!-- 3. gradient wordmark and the brand line, on white -->
  <p class="t wm clip" aria-hidden="true" style="left: calc(31 * var(--u)); top: calc(1184 * var(--u)); background-image: linear-gradient(to bottom, #000, #c40003 113.87%);">HALO</p>
  <p class="t" style="left: calc(39 * var(--u)); top: calc(1341 * var(--u)); width: calc(457 * var(--u)); font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 200; font-size: calc(22.32 * var(--u)); color: #000; white-space: normal;">
    <span style="display: block;">Halo is precision in beauty —</span>
    <span style="display: block;">flawless, deliberate, and <span style="font-weight: 400;">ahead of its time.</span></span>
  </p>

  <!-- 4. flowers portrait -->
  <img src="assets/halo/flowers.webp" alt="A dark portrait of a person with the light falling across half of their face, framed by deep red and pale white flowers" width="2560" height="1707"
    style="left: 0; top: calc(1456 * var(--u)); width: calc(834 * var(--u)); height: calc(556 * var(--u));">
  <p class="t avenir" style="left: calc(84 * var(--u)); top: calc(1923 * var(--u)); font-size: calc(22.32 * var(--u)); font-weight: 200; color: #e0e0e0;">Shop Tomorrow, Today</p>

  <!-- 5. eye in the light -->
  <img src="assets/halo/eye.webp" alt="A face turned toward a single beam of light, one eye lit and the rest of the frame in deep shadow" width="2560" height="1707"
    style="left: 0; top: calc(2011 * var(--u)); width: calc(836 * var(--u)); height: calc(557 * var(--u));">
  <p class="t avenir clip" style="left: calc(475 * var(--u)); top: calc(2396 * var(--u)); font-size: calc(47.711 * var(--u)); font-weight: 200; background-image: linear-gradient(-89.9999991456416deg, rgb(255, 255, 255) 2.6799%, rgb(43, 43, 43) 97.703%);">Own the Light</p>
  <p class="t avenir clip" style="left: calc(475 * var(--u)); top: calc(2473 * var(--u)); font-size: calc(47.711 * var(--u)); font-weight: 200; background-image: linear-gradient(-89.99999902075191deg, rgb(255, 255, 255) 2.6799%, rgb(43, 43, 43) 97.703%);">with Confidence</p>

  <!-- 6. two black and white portraits -->
  <img src="assets/halo/left.webp" alt="A black and white portrait of a young woman holding a small branch of delicate flowers in front of her" width="1600" height="2400"
    style="left: 0; top: calc(2568 * var(--u)); width: calc(418 * var(--u)); height: calc(627 * var(--u));">
  <img src="assets/halo/right.webp" alt="A black and white profile portrait of a man with his eyes closed and his face tilted up" width="1600" height="2400"
    style="left: calc(421 * var(--u)); top: calc(2568 * var(--u)); width: calc(414 * var(--u)); height: calc(622 * var(--u));">
  <p class="t avenir" style="left: calc(128 * var(--u)); top: calc(2588 * var(--u)); font-size: calc(23.79 * var(--u)); font-weight: 200; color: #000;">Beyond Trends. </p>
  <p class="t avenir" style="left: calc(575 * var(--u)); top: calc(2588 * var(--u)); font-size: calc(23.79 * var(--u)); font-weight: 200; color: #fff;">Beyond Time.</p>

  <button type="button" class="join">Join the HALO Movement</button>
</main>
</div>
