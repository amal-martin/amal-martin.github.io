<!-- Inter Thin and Montserrat ExtraLight/Regular are the fonts in the Figma file.
     Avenir Next (also in the file) is a system font on Apple devices; Mulish is the closest open stand-in elsewhere. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100&family=Montserrat:wght@200;400&family=Mulish:wght@200;400&display=swap" rel="stylesheet">

<style>
  /* One unit = 1px of the 834px-wide Figma frame. It scales with the width of the screen, edge to edge, so the page
     is the same composition on a phone, a tablet, a laptop or a wide monitor. (cqw = the width of .stage, which
     excludes any scrollbar, unlike 100vw.) */
  .stage { container-type: inline-size; width: 100%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; -webkit-text-size-adjust: 100%; }
  body { -webkit-font-smoothing: antialiased; }

  .halo { --u: calc(100cqw / 834); position: relative; width: 100%; background: #fff; }
  .halo img { position: absolute; display: block; object-fit: cover; }
  .halo .t { position: absolute; margin: 0; line-height: normal; white-space: nowrap; font-weight: normal; }

  /* Each scene is capped to exactly one screen, so a tall full-bleed image never forces extra
     scroll on its own. .scene-inner keeps every element's original Figma top/left untouched -
     it just carries the whole scene up by its own start offset (--sy), so nothing needed
     recalculating by hand and nothing can drift out of sync between scenes.
     --u stays purely width-driven, exactly like the original single-canvas design - every
     element (full-bleed images included) was positioned/sized off this same scale, so a
     height-based clamp here would shrink text/partial-width images without shrinking a
     width:100% background to match, pulling them out of their Figma-exact alignment. A
     section's own height is simply fixed at 100svh regardless; on an extreme aspect ratio
     that just means a full-bleed image's top/bottom gets cropped a little more, same as it
     already does at any width via object-fit: cover. */
  .scene { position: relative; width: 100%; height: 100svh; overflow: hidden;
    --u: calc(100cqw / 834); }
  /* Full-bleed scene backgrounds are a direct child of .scene (never .scene-inner), so they
     simply fill it edge to edge with no --sy math involved at all. */
  .scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* A parallaxed bg needs slack to shift into without exposing the scene edge behind it -
     oversized by more than the max possible scroll-driven offset in either direction. */
  .scene-bg[data-parallax] { top: -6%; height: 112%; }
  .scene-inner { position: absolute; left: 0; top: calc(-1 * var(--sy, 0) * var(--u)); width: 100%; height: 100%; }
  .scene-center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    gap: calc(28 * var(--u)); padding: calc(40 * var(--u)) calc(24 * var(--u)); }

  .wm { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 100; font-size: calc(120.669 * var(--u)); width: calc(318 * var(--u)); height: calc(119 * var(--u)); }
  .avenir { font-family: "Avenir Next", "Mulish", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .clip { -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

  .join { position: absolute; left: calc(308 * var(--u)); top: calc(3073 * var(--u)); width: calc(218.505 * var(--u)); height: calc(49.985 * var(--u));
    border: 0; padding: 0; border-radius: calc(29.857 * var(--u)); background: #fff; color: #000; cursor: pointer;
    font-family: "Avenir Next", "Mulish", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 200; font-size: calc(15.005 * var(--u)); line-height: normal; }

  /* a small way back to the portfolio; not part of the design */
  .back { position: fixed; left: 14px; top: 14px; z-index: 5; display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 999px;
    background: rgb(20 20 20 / .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; text-decoration: none;
    font: 500 12px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .02em; transition: background-color .25s ease; }
  .back:hover { background: rgb(20 20 20 / .8); }
  .back svg { width: 12px; height: 12px; }
</style>
<link rel="stylesheet" href="assets/work/concept-fx.css">

<body>

<div class="stage">
<main class="halo" id="top">

  <!-- 1. hero portrait with the white wordmark -->
  <section class="scene">
    <img class="scene-bg" data-reveal="img" data-parallax="0.07" src="assets/halo/hero.webp" alt="A model with a platinum bob and dark sunglasses, in an orange high-neck outfit and a white belt, standing between terracotta walls under a blue sky" width="2560" height="1752">
    <div class="scene-inner" style="--sy: 0;">
      <h1 class="t wm" data-reveal style="left: calc(494 * var(--u)); top: 0; color: #fff;">HALO</h1>
    </div>
  </section>

  <!-- 2. close-up with the first tagline -->
  <section class="scene">
    <img class="scene-bg" data-reveal="img" src="assets/halo/closeup.webp" alt="A black and white close-up of a face, with glittering flecks scattered across the cheekbone" width="2560" height="1707" style="object-position: 0 0;">
    <div class="scene-inner" style="--sy: 579;">
      <p class="t avenir" data-reveal style="left: calc(39 * var(--u)); top: calc(1088 * var(--u)); font-size: calc(22.32 * var(--u)); font-weight: 400; color: #e0e0e0;">Futuristic. Fearless. Halo.</p>
    </div>
  </section>

  <!-- 3. gradient wordmark and the brand line, on white -->
  <section class="scene scene-center">
    <p class="t wm clip" data-reveal aria-hidden="true" style="position: static; background-image: linear-gradient(to bottom, #000, #c40003 113.87%);">HALO</p>
    <p class="t" data-reveal style="position: static; width: calc(457 * var(--u)); font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 200; font-size: calc(22.32 * var(--u)); color: #000; white-space: normal;">
      <span style="display: block;">Halo is precision in beauty —</span>
      <span style="display: block;">flawless, deliberate, and <span style="font-weight: 400;">ahead of its time.</span></span>
    </p>
  </section>

  <!-- 4. flowers portrait -->
  <section class="scene">
    <img class="scene-bg" data-reveal="img" data-parallax="0.06" src="assets/halo/flowers.webp" alt="A dark portrait of a person with the light falling across half of their face, framed by deep red and pale white flowers" width="2560" height="1707">
    <div class="scene-inner" style="--sy: 1456;">
      <p class="t avenir" data-reveal style="left: calc(84 * var(--u)); top: calc(1923 * var(--u)); font-size: calc(22.32 * var(--u)); font-weight: 200; color: #e0e0e0;">Shop Tomorrow, Today</p>
    </div>
  </section>

  <!-- 5. eye in the light -->
  <section class="scene">
    <img class="scene-bg" data-reveal="img" data-parallax="0.06" src="assets/halo/eye.webp" alt="A face turned toward a single beam of light, one eye lit and the rest of the frame in deep shadow" width="2560" height="1707">
    <div class="scene-inner" style="--sy: 2011;">
      <p class="t avenir clip" data-reveal style="left: calc(475 * var(--u)); top: calc(2396 * var(--u)); font-size: calc(47.711 * var(--u)); font-weight: 200; background-image: linear-gradient(-89.9999991456416deg, rgb(255, 255, 255) 2.6799%, rgb(43, 43, 43) 97.703%);">Own the Light</p>
      <p class="t avenir clip" data-reveal style="left: calc(475 * var(--u)); top: calc(2473 * var(--u)); font-size: calc(47.711 * var(--u)); font-weight: 200; background-image: linear-gradient(-89.99999902075191deg, rgb(255, 255, 255) 2.6799%, rgb(43, 43, 43) 97.703%); --d: .1s;">with Confidence</p>
    </div>
  </section>

  <!-- 6. two black and white portraits -->
  <section class="scene">
    <img class="scene-bg" data-reveal="img" src="assets/halo/left.webp" alt="A black and white portrait of a young woman holding a small branch of delicate flowers in front of her" width="1600" height="2400"
      style="left: 0; width: calc(418 * var(--u)); right: auto;">
    <img class="scene-bg" data-reveal="img" src="assets/halo/right.webp" alt="A black and white profile portrait of a man with his eyes closed and his face tilted up" width="1600" height="2400"
      style="left: calc(421 * var(--u)); width: calc(414 * var(--u)); right: auto; --d: .1s;">
    <div class="scene-inner" style="--sy: 2568;">
    <p class="t avenir" data-reveal style="left: calc(128 * var(--u)); top: calc(2588 * var(--u)); font-size: calc(23.79 * var(--u)); font-weight: 200; color: #000;">Beyond Trends. </p>
    <p class="t avenir" data-reveal style="left: calc(575 * var(--u)); top: calc(2588 * var(--u)); font-size: calc(23.79 * var(--u)); font-weight: 200; color: #fff; --d: .1s;">Beyond Time.</p>
    <button type="button" class="join" data-reveal>Join the HALO Movement</button>
    </div>
  </section>
</main>
</div>
